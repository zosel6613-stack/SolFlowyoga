<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="알울라 사막에서 여러 명이 함께 요가하고 차담을 나누는 3D 공간">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AlUla Desert Plaza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Gowun+Dodum&display=swap">
</head>
<body>
<style>
/* Layout: full-bleed 3D canvas; floating sandstone-glass panels pinned to safe-area corners */
:root{
  --dusk:#2a1810;
  --panel:rgba(48,26,16,.66);
  --panel-line:rgba(255,214,170,.22);
  --fg:#fff4e6;
  --muted:#e9c9a6;
  --ember:#e2793c;
  --ember-hi:#f29a5c;
  --display:"Marcellus","Times New Roman",serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--dusk);color:var(--fg);font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:none}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%}
.glass{background:var(--panel);border:1px solid var(--panel-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:14px}

/* entry */
#entry{position:fixed;inset:0;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,rgba(42,24,16,.15),rgba(42,24,16,.55));z-index:20}
#entry .card{width:min(360px,100%);padding:26px 22px 22px;display:grid;gap:16px}
#entry h1{margin:0;font-family:var(--display);font-weight:400;font-size:40px;letter-spacing:.06em;line-height:1;text-wrap:balance}
#entry h1 small{display:block;font-family:var(--body);font-size:14px;letter-spacing:0;color:var(--muted);margin-top:8px}
#entry label{font-size:12px;letter-spacing:.08em;color:var(--muted)}
#nick{width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:var(--fg);background:rgba(255,240,220,.08);border:1px solid var(--panel-line);border-radius:10px;padding:11px 12px;-webkit-user-select:text;user-select:text}
#nick:focus-visible{outline:2px solid var(--ember-hi);outline-offset:1px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
#entry{align-items:end;padding-block:0 calc(14px + env(safe-area-inset-bottom,0px))}
#entry .card{gap:12px;padding:16px 16px 14px;max-height:58vh;overflow-y:auto}
#entry h1{font-size:30px}#entry h1 small{margin-top:4px;font-size:13px}
.field{display:grid;gap:6px}
.tabs{display:flex;gap:4px;background:rgba(255,240,220,.07);border-radius:10px;padding:3px}
.tabs button{flex:1;font:inherit;font-size:13px;white-space:nowrap;color:var(--muted);background:none;border:0;border-radius:8px;padding:7px 4px;cursor:pointer}
.tabs button[aria-selected="true"]{background:rgba(255,240,220,.16);color:var(--fg)}
.tabs button:focus-visible,.opt:focus-visible,.ghost:focus-visible{outline:2px solid var(--ember-hi);outline-offset:2px}
#tabBody{display:grid;gap:10px;min-height:110px}
.grp{display:grid;gap:6px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{font:inherit;font-size:13px;color:var(--fg);background:rgba(255,240,220,.07);border:1px solid var(--panel-line);border-radius:999px;padding:6px 12px;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--fg);color:#2a1408;border-color:var(--fg)}
.tabdice{justify-self:start}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
.ghost{font:inherit;font-size:14px;color:var(--fg);background:rgba(255,240,220,.08);border:1px solid var(--panel-line);border-radius:10px;padding:0 14px;cursor:pointer}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.sw[aria-pressed="true"]{border-color:var(--fg);transform:scale(1.08)}
.sw:focus-visible{outline:2px solid var(--ember-hi);outline-offset:2px}
.btn{font:inherit;font-size:16px;color:#2a1408;background:var(--ember);border:0;border-radius:10px;padding:12px 16px;cursor:pointer;font-weight:700}
.btn:hover{background:var(--ember-hi)}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.fine{font-size:12px;color:var(--muted);margin:0;line-height:1.5}

/* hud */
[hidden]{display:none!important}
#top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:5}
#place{padding:8px 12px;pointer-events:auto}
#place b{font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.05em;display:block}
#place span{font-size:12px;color:var(--muted);white-space:nowrap}
.right{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{white-space:nowrap;pointer-events:auto;padding:8px 12px;font:inherit;color:var(--fg);cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px}
#voiceBtn[aria-pressed="true"]{background:rgba(40,120,80,.75)}
.chip:focus-visible{outline:2px solid var(--ember-hi);outline-offset:2px}
#nightBtn[aria-pressed="true"],#soundBtn[aria-pressed="true"],#muteBtn[aria-pressed="true"]{background:rgba(30,34,70,.7)}
#who i{width:8px;height:8px;border-radius:50%;background:#7fd38a;display:inline-block}
#who.off i{background:#b9a08a}
#list{position:fixed;top:calc(100px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));padding:10px 12px;min-width:150px;max-width:220px;max-height:50vh;overflow:auto;z-index:6;font-size:14px;display:grid;gap:7px}
#list div{display:flex;align-items:center;gap:8px;min-width:0}
#list div span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list em{font-style:normal;color:var(--muted);font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

#joy{position:fixed;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(48,26,16,.35);border:1px solid var(--panel-line);z-index:5;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,236,214,.85);box-shadow:0 2px 10px rgba(0,0,0,.25)}
#actions{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:5}
@media (max-width:799px){#actions{max-width:136px;flex-wrap:wrap-reverse;justify-content:flex-end}}
.round{width:62px;height:62px;line-height:1.15;text-align:center;border-radius:50%;font:inherit;font-size:13px;color:var(--fg);cursor:pointer;display:grid;place-items:center;padding:0}
.round:focus-visible{outline:2px solid var(--ember-hi);outline-offset:2px}
.seat{background:var(--ember);color:#2a1408;border:0;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.seat:hover{background:var(--ember-hi)}
.seat:disabled{background:rgba(48,26,16,.66);color:var(--muted);border:1px solid var(--panel-line);cursor:default;box-shadow:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));padding:9px 14px;font-size:14px;z-index:8;max-width:calc(100% - 32px);text-align:center}
#asana{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(170px + env(safe-area-inset-bottom,0px));z-index:7;padding:10px 12px 12px}
@media (min-width:700px){#asana{left:auto;width:380px;bottom:calc(110px + env(safe-area-inset-bottom,0px))}}
#asana header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#asana header b{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.06em}
#poseRest{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 6px}
#poseList{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity;touch-action:pan-x}
#poseList .pose{flex:none;max-width:190px;scroll-snap-align:start}
.pose{font:inherit;color:var(--fg);background:rgba(255,240,220,.07);border:1px solid var(--panel-line);border-radius:10px;padding:6px 10px;text-align:left;cursor:pointer;display:grid;gap:2px;min-width:0}
.pose b{font-size:13px;white-space:nowrap}.pose span{font-size:10px;color:var(--muted);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pose[aria-pressed="true"]{background:var(--ember);border-color:var(--ember);color:#2a1408}.pose[aria-pressed="true"] span{color:#4a2a14}
.pose:focus-visible,#poseRest:focus-visible{outline:2px solid var(--ember-hi);outline-offset:2px}
#fade{position:fixed;inset:0;background:#2a1810;opacity:0;transition:opacity .4s;z-index:30;pointer-events:none}#fade.on{opacity:1}
#goMenu{position:fixed;top:calc(100px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:9;display:grid;padding:6px;gap:2px;min-width:140px}
#goMenu button{font:inherit;font-size:14px;color:var(--fg);background:none;border:0;border-radius:8px;padding:9px 12px;text-align:left;cursor:pointer}
#goMenu button:hover,#goMenu button:focus-visible{background:rgba(255,240,220,.12);outline:none}
#goMenu button[aria-current="true"]{color:var(--ember-hi)}
#privMenuCount{color:var(--muted);font-size:12px;margin-left:4px;font-variant-numeric:tabular-nums}
#medSheet{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(170px + env(safe-area-inset-bottom,0px));z-index:7;padding:10px 12px 12px;display:grid;gap:10px}
@media (min-width:700px){#medSheet{left:auto;width:380px;bottom:calc(110px + env(safe-area-inset-bottom,0px))}}
#medSheet header{display:flex;justify-content:space-between;align-items:center}
#medSheet header b{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.06em}
#medClose{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 6px}
#bowlRow{display:flex;align-items:flex-end;justify-content:space-between;gap:4px}
.bowl{border-radius:0 0 999px 999px;border:1px solid rgba(255,255,255,.55);background:radial-gradient(circle at 50% 20%,rgba(255,255,255,.95),rgba(220,228,245,.75) 60%,rgba(190,200,230,.6));color:#3b3550;font:inherit;font-size:12px;cursor:pointer;padding:0;display:grid;place-items:center;flex:none}
.bowl:focus-visible{outline:2px solid var(--ember-hi);outline-offset:2px}
.bowl.ring{animation:ring 1.4s ease-out}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(230,236,255,.8)}100%{box-shadow:0 0 0 16px rgba(230,236,255,0)}}
.timer{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;border-top:1px solid var(--panel-line);padding-top:10px}
#tDisp{font-family:var(--display);font-size:34px;letter-spacing:.04em;font-variant-numeric:tabular-nums;grid-row:span 2}
.tmins,.tbtns{display:flex;gap:6px;justify-content:flex-end}.tbtns .btn{padding:8px 16px;font-size:14px}.tbtns .ghost{padding:8px 12px}
#tBadge{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));padding:6px 14px;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;z-index:6}
@media (prefers-reduced-motion:reduce){.bowl.ring{animation:none}}
#beachAsk{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);width:min(300px,calc(100% - 32px));padding:18px 16px 14px;z-index:12;display:grid;gap:8px;text-align:center}
#beachAsk b{font-family:var(--display);font-weight:400;font-size:22px}#beachAsk p{margin:0 0 6px;color:var(--muted)}
#swimSheet{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:11;padding:10px 12px 12px;display:grid;gap:10px;max-height:56vh;overflow-y:auto}
@media (min-width:700px){#swimSheet{left:auto;width:380px}}
#swimSheet header b{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.06em}
#swimBody{display:grid;gap:10px}
#asana .hbtns{display:flex;gap:4px}
#classBtn{font:inherit;font-size:13px;background:var(--ember);color:#2a1408;border:0;border-radius:999px;cursor:pointer;padding:4px 10px;font-weight:700}
#classBar{position:fixed;left:50%;transform:translateX(-50%);top:calc(124px + env(safe-area-inset-top,0px));z-index:6;padding:7px 8px 7px 14px;display:flex;gap:10px;align-items:center;font-size:13px;white-space:nowrap;max-width:calc(100% - 24px)}
#classText{overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
#classStop{font:inherit;font-size:12px;color:var(--fg);background:rgba(255,240,220,.12);border:0;border-radius:999px;padding:4px 10px;cursor:pointer}
#netWhy{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(150px + env(safe-area-inset-top,0px));margin:0;padding:6px 10px;font-size:12px;color:var(--muted);z-index:5;max-width:240px}
#chatBtn{position:relative}
#badge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--ember);color:#2a1408;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
#chat{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px));max-height:44vh;display:flex;flex-direction:column;z-index:7;overflow:hidden}
@media (min-width:700px){#chat{left:auto;width:360px}}
#chat header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px}
#chat header b{font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.04em}
#chatClose{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 6px}
#chatLog{flex:1;overflow-y:auto;padding:0 12px 8px;display:grid;gap:7px;align-content:start;min-height:80px;-webkit-user-select:text;user-select:text}
.msg{display:flex;gap:6px;align-items:baseline;font-size:14px;line-height:1.45;min-width:0}
.msg .dot{transform:translateY(1px)}
.msg b{flex:none;font-weight:700}
.msg span{min-width:0;overflow-wrap:anywhere}
#chatForm{display:flex;gap:8px;padding:8px 10px 10px;border-top:1px solid var(--panel-line)}
#chatInput{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--fg);background:rgba(255,240,220,.08);border:1px solid var(--panel-line);border-radius:10px;padding:9px 10px;-webkit-user-select:text;user-select:text}
#chatInput:focus-visible{outline:2px solid var(--ember-hi);outline-offset:1px}
#chatForm .btn{padding:9px 14px;font-size:14px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));font-size:13px;padding:7px 12px;z-index:4;white-space:nowrap;transition:opacity .8s}
@media (min-width:800px){#hint{bottom:calc(30px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="scene" aria-label="알울라 사막 3D 공간"></canvas>

<div id="entry">
  <form class="card glass" id="entryForm">
    <h1>AlUla<small>나만의 요가 친구를 만들어 사막에 들어가요</small></h1>
    <div class="field">
      <label for="nick">닉네임</label>
      <input id="nick" maxlength="12" autocomplete="off" placeholder="예: 사막여우" required>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="tabBody"></div>
    <div class="row2"><button class="ghost" type="button" id="dice">전체 랜덤</button><button class="btn" type="submit" id="enterBtn">사막으로 들어가기</button></div>
  </form>
</div>

<div id="hud" hidden>
  <div id="top">
    <div id="place" class="glass"><b>AlUla</b><span id="matCount">매트 20/20 비어 있음</span></div>
    <div class="right"><button id="voiceBtn" class="glass chip" type="button" aria-pressed="false" hidden>음성 대화</button><button id="muteBtn" class="glass chip" type="button" aria-pressed="false" hidden>마이크 끄기</button><button id="goBtn" class="glass chip" type="button" aria-expanded="false">이동</button><button id="editBtn" class="glass chip" type="button">꾸미기</button><button id="soundBtn" class="glass chip" type="button" aria-pressed="false">소리 켜기</button><button id="nightBtn" class="glass chip" type="button" aria-pressed="false">밤 사막</button>
    <button id="who" class="glass off chip" type="button" aria-expanded="false"><i></i><span id="whoText">혼자 있어요</span></button></div>
  </div>
  <div id="list" class="glass" hidden></div>
  <p id="netWhy" class="glass" hidden></p>
  <div id="goMenu" class="glass" hidden><button type="button" data-go="plaza" id="go-plaza">요가 광장</button><button type="button" data-go="tea" id="go-tea">차담 텐트</button><button type="button" data-go="med" id="go-med">명상 동굴</button><button type="button" data-go="beach" id="go-beach">바다</button><button type="button" data-go="paris" id="go-paris">파리</button><button type="button" data-go="priv" id="go-priv">개인 수련실<span id="privMenuCount"></span></button></div>
  <div id="joy" aria-label="이동 조이스틱"><div id="knob"></div></div>
  <div id="actions">
    <button class="round glass" id="chatBtn" type="button" aria-expanded="false">채팅<span id="badge" hidden>0</span></button>
    <button class="round glass" id="waveBtn" type="button">인사</button>
    <button class="round glass" id="savBtn" type="button" aria-expanded="false" hidden>아사나</button>
    <button class="round glass" id="medBtn" type="button" aria-expanded="false" hidden>명상</button>
    <button class="round glass" id="swimBtn" type="button" hidden>수영복</button>
    <button class="round glass" id="privBowlBtn" type="button" hidden>싱잉볼</button>
    <button class="round glass" id="sipBtn" type="button" hidden aria-label="커피 마시기">커피</button>
    <button class="round seat" id="seatBtn" type="button" hidden>앉기</button>
  </div>
  <div id="hint" class="glass">매트 가까이 걸어가면 앉을 수 있어요</div>
  <div id="toast" class="glass" role="status" hidden></div>
  <div id="fade" hidden></div>
  <div id="tBadge" class="glass" hidden>10:00</div>
  <div id="classBar" class="glass" hidden><span id="classText">수업</span><button type="button" id="classStop">그만</button></div>
  <div id="beachAsk" class="glass" role="dialog" aria-label="수영복 갈아입기" hidden>
    <b>바다에 왔어요!</b><p>수영복으로 갈아입을까요?</p>
    <div class="row2"><button type="button" class="ghost" id="askNo">이대로 갈게요</button><button type="button" class="btn" id="askYes">갈아입기</button></div>
  </div>
  <section id="swimSheet" class="glass" hidden aria-label="수영복">
    <header><b>Swimwear</b></header>
    <div id="swimBody"></div>
    <div class="row2"><button type="button" class="ghost" id="swimOff">원래 옷으로</button><button type="button" class="btn" id="swimDone">완료</button></div>
  </section>
  <section id="medSheet" class="glass" hidden aria-label="명상">
    <header><b>Crystal bowls</b><button id="medClose" type="button">닫기</button></header>
    <div id="bowlRow"></div>
    <div class="timer">
      <div id="tDisp">10:00</div>
      <div class="tmins"><button type="button" class="opt tmin" data-m="5" id="tmin-5">5분</button><button type="button" class="opt tmin" data-m="10" id="tmin-10">10분</button><button type="button" class="opt tmin" data-m="15" id="tmin-15">15분</button></div>
      <div class="tbtns"><button type="button" class="ghost" id="tReset">처음으로</button><button type="button" class="btn" id="tStart">시작</button></div>
    </div>
  </section>
  <section id="asana" class="glass" hidden aria-label="아사나">
    <header><b>Asana</b><span class="hbtns"><button id="classBtn" type="button">수업 따라 하기</button><button id="poseRest" type="button">편히 앉기</button></span></header>

function animateAvatar(g,moving,dt,t,sitting,pose,pillowHex){
  const u=g.userData;u.phase+=dt*(moving?10:0);

  if(!u.cur)u.cur=JSON.parse(JSON.stringify(target));
  const c=u.cur,k=Math.min(1,dt*5);

  const breath=Math.sin(t*1.2)*0.012;

  const sw=moving&&!sitting?Math.sin(u.phase):0,walk=moving&&!sitting?1:0;
  u.inner.position.set(0,c.hy+hop+(walk?Math.abs(Math.cos(u.phase))*0.04:breath*0.5),c.iz);u.inner.rotation.x=c.ix;
  u.spine.rotation.x=c.sp+(walk?0.08:0);u.spine.scale.y=1+breath;
  u.head.rotation.set(c.hx,c.hr,0);
  const setArm=(a,v,s)=>{a.sh.rotation.set(v[0]+(walk?s*sw*0.6:0),v[3]||0,v[1]);a.el.rotation.x=v[2]};
  const setLeg=(l,v,s)=>{l.hip.rotation.set(v[0]+(walk?s*sw*0.55:0),0,v[1]);l.kn.rotation.x=v[2]+(walk?Math.max(0,-s*sw)*0.9:0)};
  setArm(u.aL,c.aL,-1);setArm(u.aR,c.aR,1);setLeg(u.lL,c.lL,1);setLeg(u.lR,c.lR,-1);
  if(u.wave>0){u.aL.sh.rotation.set(0,0,2.6+Math.sin(t*16)*0.25);u.aL.el.rotation.x=-0.3}
  if(u.carry)u.carry.visible=!sitting;
  if(u.skirt){const seated=sitting&&(!POSE_KEYS.has(pose)||pose==='lotus')?1:0;u.sk+=(seated-u.sk)*k;u.skirt.scale.set(1+0.8*u.sk,1-0.68*u.sk,1+0.8*u.sk)}

}

function updateAnimals(dt){
  const T=Date.now()/1000;
  animals.forEach(a=>{
    // eased clock: the animal speeds up, slows to an idle, then moves on
    const u=T+0.92*Math.sin(a.om*T)/a.om,v=1+0.92*Math.cos(a.om*T);
    const x=a.hx+a.ax*Math.sin(a.w1*u+a.p1),z=a.hz+a.az*Math.sin(a.w2*u+a.p2);
    const dx=a.ax*a.w1*Math.cos(a.w1*u+a.p1),dz=a.az*a.w2*Math.cos(a.w2*u+a.p2);
    a.g.position.set(x,H(x,z),z);
    let d=Math.atan2(dx,dz)-a.g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));a.g.rotation.y+=d*Math.min(1,dt*3);
    const walk=Math.min(1,v*0.8);a.ph+=dt*a.cadence*walk;
    a.legs.forEach((l,i)=>{if(a.scorpion)l.rotation.y=Math.sin(a.ph+i*1.3)*a.swing*walk;else l.rotation.x=Math.sin(a.ph+(i===0||i===3?0:Math.PI))*a.swing*walk});
    if(a.head)a.head.rotation.y=Math.sin(T*0.6+a.p1)*0.25*(1.2-walk);
    if(a.cat&&a.tail)a.tail.rotation.z=Math.sin(T*2+a.p2)*0.3;
    else if(a.scorpion)a.tail.rotation.x=Math.sin(T*1.5+a.p1)*0.12;
    else if(a.tail)a.tail.rotation.z=Math.sin(T*3+a.p2)*0.2;
  });
}

/* oud sound, synthesized (Karplus-Strong) in the Hijaz mode; only by the fire at night */
let actx=null,master=null,soundOn=false,nextNote=0,step=0,mel=3;const pluckCache={};
const HIJAZ=[146.83,164.81,185.0,220.0,246.94,293.66,329.63,369.99,440.0],BASS=[73.42,55.0,61.74,49.0];
function pluckBuf(f){if(pluckCache[f])return pluckCache[f];const sr=actx.sampleRate,len=Math.floor(sr*2.2),buf=actx.createBuffer(1,len,sr),d=buf.getChannelData(0);
  const N=Math.max(2,Math.round(sr/f)),ring=new Float32Array(N);for(let i=0;i<N;i++)ring[i]=Math.random()*2-1;let ix=0;
  for(let i=0;i<len;i++){const a=ring[ix],b=ring[(ix+1)%N];d[i]=a;ring[ix]=0.4972*(a+b);ix=(ix+1)%N}return pluckCache[f]=buf}
function playNote(f,when,vol){const s=actx.createBufferSource();s.buffer=pluckBuf(f);const gn=actx.createGain();gn.gain.value=vol;s.connect(gn);gn.connect(master);s.start(when)}
/* yoga music around the mats: low drone, slow pentatonic chimes, a singing bowl now and then */
let yogaBus=null,chimeNext=0,bowlNext=0;
const CHIME=[293.66,329.63,369.99,440,493.88,587.33,659.25];
function initYoga(){
  yogaBus=actx.createGain();yogaBus.gain.value=0;const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;yogaBus.connect(lp);lp.connect(actx.destination);
  const drone=actx.createGain();drone.gain.value=0.5;drone.connect(yogaBus);
  const lfo=actx.createOscillator();lfo.frequency.value=0.07;const lg=actx.createGain();lg.gain.value=0.18;lfo.connect(lg);lg.connect(drone.gain);lfo.start();
  [[73.42,'sine',0.26],[73.9,'sine',0.14],[110,'sine',0.12],[146.83,'triangle',0.04]].forEach(([f,type,v])=>{const o=actx.createOscillator();o.type=type;o.frequency.value=f;const gn=actx.createGain();gn.gain.value=v;o.connect(gn);gn.connect(drone);o.start()});
}
function tone(f,when,peak,att,rel,type){const o=actx.createOscillator();o.type=type||'sine';o.frequency.value=f;const gn=actx.createGain();gn.gain.setValueAtTime(0.0001,when);
  gn.gain.exponentialRampToValueAtTime(peak,when+att);gn.gain.exponentialRampToValueAtTime(0.0001,when+att+rel);o.connect(gn);gn.connect(yogaBus);o.start(when);o.stop(when+att+rel+0.1)}
function updateYoga(){
  const now=actx.currentTime,d=Math.hypot(pos.x,pos.z-6);
  const vol=me?Math.max(0,Math.min(1,1-(d-14)/16)):0;yogaBus.gain.setTargetAtTime(vol*0.55,now,0.6);
  if(vol<0.01){chimeNext=Math.max(chimeNext,now);bowlNext=Math.max(bowlNext,now+2);return}
  if(chimeNext<now+0.1){const n=1+(Math.random()<0.35);for(let i=0;i<n;i++)tone(CHIME[Math.floor(Math.random()*CHIME.length)],chimeNext+i*0.6,0.05,1.4,4.5);chimeNext=Math.max(chimeNext,now)+2.8+Math.random()*2.4}
  if(bowlNext<now+0.1){const f=220,w=Math.max(bowlNext,now);[[f,0.11],[f*1.004,0.08],[f*2.76,0.04],[f*5.4,0.018]].forEach(([fr,v])=>tone(fr,w,v,0.02,9));bowlNext=w+13+Math.random()*7}
}
function updateSound(){
  if(!soundOn||!actx)return;
  if(yogaBus)updateYoga();
  const d=Math.hypot(pos.x-npc.x,pos.z-npc.z),k=typeof night==='number'?night:0;
  const vol=me?Math.max(0,Math.min(1,1-(d-3)/16))*Math.max(0,(k-0.35)/0.65):0;
  master.gain.setTargetAtTime(vol*0.5,actx.currentTime,0.4);
  if(nextNote<actx.currentTime)nextNote=actx.currentTime+0.05;
  while(nextNote<actx.currentTime+0.2){
    if(vol>0.01){const bar=Math.floor(step/8)%4,s=step%8;
      if(s===0||s===4)playNote(s===0?BASS[bar]:BASS[bar]*1.5,nextNote,0.4);
      if(s%2===0&&s!==0||s!==0&&Math.random()<0.3){mel=Math.max(0,Math.min(HIJAZ.length-1,mel+[-1,-1,1,1,0,2,-2][Math.floor(Math.random()*7)]));playNote(HIJAZ[mel],nextNote,0.24)}}

let beachK=0,parisK=0;const PARIS_FOG=new THREE.Color(0xd6e4ef);const BEACH_FOG=new THREE.Color(0xf4ab84),_fogTmp=new THREE.Color();

    const dl=actx.createDelay(1);dl.delayTime.value=0.38;const fb=actx.createGain();fb.gain.value=0.32;const wet=actx.createGain();wet.gain.value=0.3;lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(actx.destination);initYoga();initWater();if(!seaBus)initSea();return true}
  catch(e){return false}}

    g.gain.setValueAtTime(0.0001,now);g.gain.exponentialRampToValueAtTime(v*vol,now+0.04);g.gain.exponentialRampToValueAtTime(0.0001,now+11);o.connect(g);g.connect(actx.destination);o.start(now);o.stop(now+11.2)});
}
